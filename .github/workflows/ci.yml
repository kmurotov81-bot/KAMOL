```yaml
name: Build Soccer 2D Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :android:assembleDebug --no-daemon

      - name: Build release APK
        run: gradle :android:assembleRelease --no-daemon

      - name: Build release AAB
        run: gradle :android:bundleRelease --no-daemon

      - name: Upload APK and AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soccer2D-Android-Build
          path: |
            android/build/outputs/apk/debug/*.apk
            android/build/outputs/apk/release/*.apk
            android/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
```
