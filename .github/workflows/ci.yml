
name: Build Soccer 2D

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Gradle project
        shell: bash
        run: |
          echo "Repository files:"
          ls -la

          ROOT_FILE=$(find . \
            -name settings.gradle.kts \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$ROOT_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            echo "Upload the complete project to GitHub."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$ROOT_FILE")
          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR=""
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project found: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android APK and AAB
        shell: bash
        run: |
          if [ -n "$PROJECT_DIR" ]; then
            cd "$PROJECT_DIR"
          fi

          gradle :android:assembleDebug \
                 :android:assembleRelease \
                 :android:bundleRelease \
                 --no-daemon

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soccer2D-Android
          path: |
            ${{ env.PROJECT_DIR }}/android/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/android/build/outputs/apk/release/*.apk
            ${{ env.PROJECT_DIR }}/android/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
