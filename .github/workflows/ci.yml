name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: 'soccer2d_fixed (3)'
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Kotlin file headers
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/${PROJECT_DIR}"
          bad=0
          while IFS= read -r f; do
            first="$(head -n 1 "$f" | tr -d '\r')"
            case "$first" in
              package\ *|import\ *|@file:*|//*|/\**|"") ;;
              *) echo "::error file=${f},line=1::Unexpected first line: $first"; bad=1 ;;
            esac
          done < <(find . -type f -name '*.kt' -not -path '*/build/*' -print)
          exit "$bad"

  server:
    needs: sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build server
        shell: bash
        env:
          SKIP_ANDROID: '1'
        run: |
          cd "${GITHUB_WORKSPACE}/${PROJECT_DIR}"
          gradle :shared:test :server:installDist --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: ${{ github.workspace }}/${{ env.PROJECT_DIR }}/server/build/install/server
          if-no-files-found: error

  android:
    needs: sanity
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_B64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "y" | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-${ANDROID_SDK_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Keystore when provided
        if: env.HAS_KEYSTORE == 'true'
        shell: bash
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Android APK / AAB
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}/${PROJECT_DIR}"
          gradle :android:assembleDebug :android:assembleRelease :android:bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            ${{ github.workspace }}/${{ env.PROJECT_DIR }}/android/build/outputs/bundle/release/*.aab
            ${{ github.workspace }}/${{ env.PROJECT_DIR }}/android/build/outputs/apk/debug/*.apk
            ${{ github.workspace }}/${{ env.PROJECT_DIR }}/android/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Play Console Internal Testing (tagged releases only)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: com.soccer.game
          releaseFiles: ${{ github.workspace }}/${{ env.PROJECT_DIR }}/android/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
