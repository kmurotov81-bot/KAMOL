name: Soccer2D CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soccer2d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          ls -la

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "soccer2d_fixed.1/settings.gradle.kts" ] || [ -f "soccer2d_fixed.1/settings.gradle" ]; then
            echo "PROJECT_DIR=soccer2d_fixed.1" >> "$GITHUB_ENV"
          else
            echo "::error::Gradle settings file not found in repository root or soccer2d_fixed.1/"
            exit 1
          fi

      - name: Confirm project files
        shell: bash
        run: |
          echo "Gradle project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          test -d "$PROJECT_DIR/android"

  server:
    name: Test shared code and build server
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Gradle project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "soccer2d_fixed.1/settings.gradle.kts" ] || [ -f "soccer2d_fixed.1/settings.gradle" ]; then
            echo "PROJECT_DIR=soccer2d_fixed.1" >> "$GITHUB_ENV"
          else
            echo "::error::Gradle project not found"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run shared tests and build server
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SKIP_ANDROID: "1"
        run: gradle :shared:test :server:installDist --no-daemon

      - name: Upload server distribution
        uses: actions/upload-artifact@v4
        with:
          name: soccer2d-server
          path: ${{ env.PROJECT_DIR }}/server/build/install/server/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    needs: verify

    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Gradle project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "soccer2d_fixed.1/settings.gradle.kts" ] || [ -f "soccer2d_fixed.1/settings.gradle" ]; then
            echo "PROJECT_DIR=soccer2d_fixed.1" >> "$GITHUB_ENV"
          else
            echo "::error::Gradle project not found"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare release keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK, release APK and release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :android:assembleDebug \
                 :android:assembleRelease \
                 :android:bundleRelease \
                 --no-daemon

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soccer2d-android
          path: |
            ${{ env.PROJECT_DIR }}/android/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/android/build/outputs/apk/release/*.apk
            ${{ env.PROJECT_DIR }}/android/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish AAB to Google Play Internal Testing
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          env.KEYSTORE_B64 != '' &&
          env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.soccer.game
          releaseFiles: ${{ env.PROJECT_DIR }}/android/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
