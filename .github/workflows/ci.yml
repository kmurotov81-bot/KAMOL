name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle :shared:test :server:installDist --no-daemon
        env: { SKIP_ANDROID: "1" }
      - uses: actions/upload-artifact@v4
        with: { name: server, path: server/build/install/server }

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }

      - name: Keystore (agar secret berilgan bo'lsa)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build (debug APK + release APK/AAB, R8 bilan)
        run: gradle :android:assembleDebug :android:assembleRelease :android:bundleRelease --no-daemon

      - name: 16 KB sahifa tekshiruvi
        run: bash tools/check16k.sh "android/build/outputs/apk/release/*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/build/outputs/bundle/release/*.aab
            android/build/outputs/apk/debug/*.apk

      - name: Play Console Internal Testing (faqat v* tag)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.soccer.game
          releaseFiles: android/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
