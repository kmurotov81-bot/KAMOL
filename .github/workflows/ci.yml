name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: KAMOL-main/soccer2d_fixed-1

jobs:
  # Gradle'dan oldin tez tekshiruv: .kt fayl boshidagi begona belgilarni ushlaydi
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kotlin fayllarining 1-qatorini tekshirish
        run: |
          bad=0
          while IFS= read -r f; do
            first="$(head -n 1 "$f" | tr -d '\r')"
            case "$first" in
              package\ *|import\ *|@file:*|//*|/\**|"") ;;
              *) echo "::error file=$f,line=1::1-qatorda begona belgi: $first"; bad=1 ;;
            esac
          done < <(find "$PROJECT_DIR" -name '*.kt' -not -path '*/build/*')
          exit $bad

  server:
    needs: sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KAMOL-main/soccer2d_fixed-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle :shared:test :server:installDist --no-daemon
        env: { SKIP_ANDROID: "1" }
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: KAMOL-main/soccer2d_fixed-1/server/build/install/server
          if-no-files-found: error

  android:
    needs: sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KAMOL-main/soccer2d_fixed-1
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_B64 != '' && 'true' || 'false' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && 'true' || 'false' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }

      - name: Keystore (agar secret berilgan bo'lsa)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build (debug APK + release APK/AAB, R8 bilan)
        run: gradle :android:assembleDebug :android:assembleRelease :android:bundleRelease --no-daemon

      - name: 16 KB sahifa tekshiruvi
        run: bash tools/check16k.sh "android/build/outputs/apk/release/*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            KAMOL-main/soccer2d_fixed-1/android/build/outputs/bundle/release/*.aab
            KAMOL-main/soccer2d_fixed-1/android/build/outputs/apk/debug/*.apk
            KAMOL-main/soccer2d_fixed-1/android/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Play Console Internal Testing (faqat v* tag)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: com.soccer.game
          releaseFiles: KAMOL-main/soccer2d_fixed-1/android/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
